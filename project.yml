name: TransitMapSpike
options:
  bundleIdPrefix: com.divinedavis
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TransitMapSpike:
    type: application
    platform: iOS
    sources: [TransitMapSpike]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divinedavis.transitmapspike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  TransitMapSpikeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TransitMapSpikeUITests]
    dependencies:
      - target: TransitMapSpike
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TransitMapSpike
schemes:
  TransitMapSpike:
    build:
      targets:
        TransitMapSpike: all
        TransitMapSpikeUITests: [test]
    test:
      targets: [TransitMapSpikeUITests]
