# Velo Maps static data — SOURCE OF TRUTH for the nginx vhost on 104.236.120.144.
# Installed by scripts/deploy_speed_limit_tiles.sh to /etc/nginx/sites-available/velomaps.
# Cert: certbot certonly --webroot -w /var/www/html --cert-name velomaps \
#         -d velomaps.104.236.120.144.sslip.io   (renews via the certbot timer)
# Temporary sslip.io hostname until Velo Maps has its own domain (no divinedavis.com for products).

# Voice: 30 requests/min per IP (a drive needs a few); the service also has a daily budget.
limit_req_zone $binary_remote_addr zone=velomaps_tts:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name velomaps.104.236.120.144.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name velomaps.104.236.120.144.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/velomaps/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/velomaps/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/velomaps;
    autoindex off;

    add_header X-Robots-Tag              "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;

    gzip on;
    gzip_types application/json;
    gzip_min_length 512;

    # Speed-limit tiles (OSM maxspeed, ODbL): static JSON, cached a day by clients/proxies.
    location /speedlimits/ {
        default_type application/json;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }
    location = /tts {
        limit_req zone=velomaps_tts burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3130;
        proxy_read_timeout 20s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location = /tts/health { proxy_pass http://127.0.0.1:3130; }
    location / { return 404; }
}
